[public]
title = "ઓપન લોજિક — ગુજરાતી"
description = "રૂપલક્ષી તર્કશાસ્ત્ર અને ગણિતીય પદ્ધતિઓ અંગે Open Logic Projectના પાઠ્યપુસ્તકની ગુજરાતી આવૃત્તિ. સ્થિર અંગ્રેજી સ્રોતના બધા ૭૨૨ એકમો PDF, EPUB અને સંપાદનીય LaTeXમાં ઉપલબ્ધ છે. રિચર્ડ ઝૅકના ગણો, તર્ક, સંગણનનું ગુજરાતી પાઠ્યપુસ્તક અલગથી ઉપલબ્ધ છે."
limitations = [
  "સ્વતંત્ર માનવીય ભાષાકીય પ્રમાણન ઉપલબ્ધ નથી.",
  "મૂળ પાઠની વૈકલ્પિક રજૂઆતો અને અધૂરા ભાગો તેમના ગણિતીય સંદર્ભ સાથે સમાવાયા છે.",
  "HTMLમાં સ્રોત-સૂચિ છે. સમગ્ર વાચનપાઠ PDF અને EPUBમાં છે.",
]
attribution = "મૂળ માનવીય લેખન Open Logic Project અને તેના સહયોગીઓનું છે. ગુજરાતી AI-અનુવાદ અને AI-નિર્મિત સંપાદકીય તથા ગણિતીય નોંધો OpenAI Codexના GPT-5.6 Sol, GPT-6 Sol અને GPT-6.1 Sol (Ultra effort) વડે તૈયાર થયાં છે. ગણો, તર્ક, સંગણનનું મૂળ પુસ્તક રિચર્ડ ઝૅકનું છે. તેના પુસ્તક-વિશિષ્ટ ગુજરાતી AI-અનુવાદ અને ગોઠવણી માટે GPT-6.1 Sol (Ultra effort) વપરાયું છે. મૂળ લેખકો, ફોટોગ્રાફરો અને ચિત્રકારોના શ્રેય સંબંધિત પ્રકાશનોમાં આપેલા છે."
license = "મૂળ લખાણ અને તેનો ગુજરાતી અનુવાદ Creative Commons Attribution 4.0 International (CC BY 4.0) હેઠળ છે. ફોટોગ્રાફ, ચિત્રો અને ફોન્ટને તેમના મૂળ પરવાના અને ઉપયોગની શરતો લાગુ પડે છે. ગણો, તર્ક, સંગણનનાં Matthew Leadbeaterનાં મુખપૃષ્ઠ અને ભાગચિત્રો CC BY-NC 4.0 હેઠળ છે."

